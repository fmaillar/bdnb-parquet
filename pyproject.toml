[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdnb-parquet"
version = "0.3.0"
description = "Streaming BDNB PostgreSQL dump to typed Parquet/GeoParquet"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=18",
  "pyproj>=3.6",
  "rapidgzip>=0.15",
  "pyogrio>=0.10",
  "zstandard>=0.23",
  "odfpy>=1.4",
  "ijson>=3.3",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
]

[project.urls]
Repository = "https://github.com/fmaillar/bdnb-parquet"
Issues = "https://github.com/fmaillar/bdnb-parquet/issues"

[project.scripts]
bdnb-parquet = "bdnb_parquet.convert:main"
bdnb-datasets-audit = "bdnb_parquet.dataset_audit:main"
bdnb-imope-promote = "bdnb_parquet.imope_promote:main"
bdnb-promote-parquet = "bdnb_parquet.promote_parquet:main"
bdnb-vigieau-convert = "bdnb_parquet.vigieau_convert:main"
bdnb-datatourisme-convert = "bdnb_parquet.datatourisme_convert:main"
bdnb-overnight-migrate = "bdnb_parquet.overnight_migrate:main"
bdnb-parquet-manifest = "bdnb_parquet.parquet_manifest:main"
bdnb-reconcile-raw-parquet = "bdnb_parquet.reconcile_raw_parquet:main"
bdnb-build-release = "bdnb_parquet.build_release:main"
bdnb-semantic-audit = "bdnb_parquet.semantic_audit:main"
bdnb-normalize-layout = "bdnb_parquet.normalize_layout:main"
bdnb-build-snapshot-index = "bdnb_parquet.snapshot_index:main"
bdnb-normalize-rna = "bdnb_parquet.normalize_rna:main"
bdnb-normalize-vigieau = "bdnb_parquet.normalize_vigieau:main"

[tool.setuptools.packages.find]
where = ["src"]
